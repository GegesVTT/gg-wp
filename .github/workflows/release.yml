name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derivar versión desde el tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inyectar version/URLs en module.json
        run: |
          jq \
            --arg v "${{ steps.v.outputs.version }}" \
            --arg url "https://github.com/${{ github.repository }}" \
            --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
            --arg download "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gg-wp.zip" \
            '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
            module.json > module.tmp
          mv module.tmp module.json

      - name: Empaquetar módulo (sin .git ni .github)
        run: zip -rq gg-wp.zip module.json scripts styles assets lang README.md LICENSE

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            gg-wp.zip
